# Silent Cartographer's island (b30) as a Royale map: port/linux/game/royale_map.c plays it as a
# multiplayer map (no AI, scripts or BSP switches; the exterior structure BSP 0). World units (1 = 10 ft).
# Made from the exterior BSP's collision geometry and debug-camera pictures.

map = "b30"
structure_bsp = 0
# the play area: outside it (or below its bottom: wading out into the sea) a player is put back where
# they last stood inside; the beam's sweep runs over its x (east, west) or y (north, south)
drop_height = 60.0
bounds_min = [-95.00, -90.00, -1.00]
bounds_max = [108.00, 80.00, 120.00]
# the glassing beam starts from one of these sides (drawn at random) and sweeps toward the far one:
# from the east it ends on the west beach's pier and towers, from the south on the north cove, outcrop and
# the north tower, the final areas with the most cover
beam_sides = ["east", "south"]

# Pelican flights across the island at drop_height, in from the sea and out the far side
[[flight_path]]
start = [-140.00, 0.00, 60.00]
end = [150.00, 0.00, 60.00]
speed = 9.0

[[flight_path]]
start = [-130.00, -120.00, 60.00]
end = [140.00, 110.00, 60.00]
speed = 9.0

[[flight_path]]
start = [5.00, -130.00, 60.00]
end = [5.00, 120.00, 60.00]
speed = 9.0

